name: Build macOS release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build binary
        run: pyinstaller --onefile --name rogi main.py

      - name: Package zip
        run: |
          cd dist
          zip -j "../rogi-macos-${{ matrix.arch }}-${{ github.ref_name }}.zip" rogi

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "rogi-macos-${{ matrix.arch }}-${{ github.ref_name }}.zip" --clobber --repo "${{ github.repository }}"
